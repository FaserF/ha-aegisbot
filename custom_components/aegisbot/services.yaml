send_message:
  description: Send a text message to one or more Telegram chats (1:1 Telegram compatible).
  fields:
    target:
      description: Numerical ID or list of IDs of Telegram chats/groups.
      example: -100123456789
      required: false
      selector:
        object:
    message:
      description: The message text to send.
      example: "Alert: Security breach detected!"
      required: true
      selector:
        text:
          multiline: true
    title:
      description: Optional message title (bold header).
      example: "AegisBot Alert"
      required: false
      selector:
        text:
    parse_mode:
      description: Formatting parser (HTML or markdown).
      default: html
      selector:
        select:
          options:
            - html
            - markdown
    disable_notification:
      description: Send message silently without sound/vibration.
      default: false
      selector:
        boolean:
    inline_keyboard:
      description: Inline button rows for interactive callback queries.
      example: "[['Turn On:ha_light_on', 'Turn Off:ha_light_off']]"
      required: false
      selector:
        object:
    keyboard:
      description: Custom reply keyboard options.
      example: "[['Option 1', 'Option 2']]"
      required: false
      selector:
        object:
    reply_to_message_id:
      description: ID of message to reply to.
      example: 12345
      required: false
      selector:
        number:
    message_thread_id:
      description: Topic/thread ID for forum supergroups.
      example: 42
      required: false
      selector:
        number:
    bot:
      description: Optional Bot ID or Username when multiple bots are active in AegisBot.
      example: "SecurityBot"
      required: false
      selector:
        text:

leave_chat:
  description: Make the bot leave a group or channel.
